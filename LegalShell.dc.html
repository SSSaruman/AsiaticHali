<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400&family=DM+Sans:opsz,wght@9..40,300..700&display=swap">
<style>
html,body{margin:0;padding:0;background:#f2e7dd;color:#221c18;font-family:"DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#4c260f;text-decoration:none}
a:hover{color:#a55a34}
</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-direction:column">
  <header style="position:sticky;top:0;z-index:10;background:rgba(242,231,221,.9);backdrop-filter:blur(16px);border-bottom:1px solid rgba(76,38,15,.1)">
    <div style="max-width:900px;margin:0 auto;padding:18px clamp(20px,4vw,32px);display:flex;align-items:center;justify-content:space-between">
      <a href="index.html" style="font:400 22px/1 'Playfair Display',serif;color:#102a3a;letter-spacing:.01em">Asiatic Halı</a>
      <a href="index.html" style="font:500 12px/1 'DM Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#4c260f">← Ana sayfa</a>
    </div>
  </header>
  <main style="flex:1;max-width:760px;margin:0 auto;padding:clamp(48px,8vh,80px) clamp(20px,4vw,32px) clamp(64px,10vh,110px)">
    <p style="margin:0;font:500 11px/1 'DM Sans',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#a55a34">{{ eyebrow }}</p>
    <h1 style="margin:14px 0 8px;font:400 clamp(30px,4vw,46px)/1.1 'Playfair Display',serif;color:#102a3a;letter-spacing:-.01em">{{ title }}</h1>
    <p style="margin:0 0 40px;font:300 13px/1.5 'DM Sans',sans-serif;color:rgba(34,28,24,.55)">{{ updated }}</p>
    <sc-for list="{{ sections }}" as="sec" hint-placeholder-count="5">
      <section style="margin-bottom:32px">
        <h2 style="margin:0 0 10px;font:500 19px/1.3 'Playfair Display',serif;color:#102a3a">{{ sec.h }}</h2>
        <sc-for list="{{ sec.p }}" as="para" hint-placeholder-count="2">
          <p style="margin:0 0 12px;font:300 15.5px/1.7 'DM Sans',sans-serif;color:rgba(34,28,24,.82);text-wrap:pretty">{{ para }}</p>
        </sc-for>
      </section>
    </sc-for>
  </main>
  <footer style="background:#221812;padding:28px clamp(20px,4vw,32px);text-align:center">
    <p style="margin:0;font:300 12.5px/1.5 'DM Sans',sans-serif;color:rgba(246,236,226,.56)">© 2026 Asiatic Halı Türkiye. Tüm hakları saklıdır.</p>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;eyebrow&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Yasal&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Başlık&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;updated&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Son güncelleme: Eylül 2026&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sections&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[],&quot;tsType&quot;:&quot;{h:string,p:string[]}[]&quot;}}"></script>
</body>
</html>
