<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300..700&display=swap">
<style>
html,body{user-select:none;-webkit-user-select:none;margin:0;padding:0;background:#f2e7dd;color:#221c18;font-family:"DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#4c260f;text-decoration:none}
a:hover{color:#a55a34}
</style>
</helmet>
<div style="min-height:100vh;background:linear-gradient(180deg,#f2e7dd 0%,#f4ece4 50%,#eee2d5 100%)">
  <header style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;max-width:1560px;margin:0 auto;padding:18px clamp(20px,3vw,48px)">
    <a href="Asiatic Hali.dc.html" style="display:inline-flex;align-items:center;min-height:44px"><img src="assets/logo-mark.webp" alt="Asiatic Halı Türkiye" style="height:44px;width:auto"></a>
    <a href="Asiatic Hali.dc.html#s03" style="display:inline-flex;align-items:center;gap:9px;min-height:44px;font:500 12px/1 'DM Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase">← Katalog</a>
  </header>
  <main style="max-width:1560px;margin:0 auto;padding:clamp(24px,5vh,56px) clamp(20px,3vw,48px) clamp(48px,8vh,96px)">
    <span style="display:inline-flex;align-items:center;gap:12px;font:500 11px/1 'DM Sans',sans-serif;letter-spacing:.24em;text-transform:uppercase;color:#a55a34">Koleksiyon <span style="width:34px;height:1px;background:#c29263"></span> {{ countLabel }}</span>
    <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:16px;padding-bottom:20px;border-bottom:1px solid rgba(76,38,15,.2)">
      <h1 style="margin:0;font:400 clamp(40px,5vw,80px)/1 'DM Sans',sans-serif;color:#102a3a;letter-spacing:-.015em">{{ name }}</h1>
      <a href="{{ bookHref }}" style="display:inline-flex;align-items:center;gap:12px;min-height:54px;padding:0 30px;border-radius:18px;background:#4c260f;color:#f6ece2;font:500 13px/1 'DM Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase" style-hover="background:#5d3116;color:#f6ece2">Kataloğu aç <span aria-hidden="true">→</span></a>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:clamp(16px,2vw,28px);margin-top:28px">
      <sc-for list="{{ cards }}" as="c" hint-placeholder-count="6">
        <a href="{{ c.href }}" style="display:flex;flex-direction:column;gap:10px;color:#102a3a" style-hover="color:#a55a34">
          <span style="display:block;aspect-ratio:1/1;overflow:hidden;border-radius:18px;background:#ece0d3;box-shadow:0 26px 46px -30px rgba(34,28,24,.55)"><img loading="lazy" decoding="async" src="{{ c.img }}" alt="{{ c.title }}" style="display:block;width:100%;height:100%;object-fit:cover"></span>
          <span style="font:400 15px/1.25 'DM Sans',sans-serif;text-wrap:balance">{{ c.title }}</span>
          <span style="font:500 11px/1 'DM Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#a55a34">Halıyı gör →</span>
        </a>
      </sc-for>
    </div>
  </main>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { list: [] };
  cid() { return (new URLSearchParams(location.search).get('c') || 'atlas').toLowerCase().replace(/[^a-z-]/g, ''); }
  componentDidMount() {
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    fetch('assets/catalog/catalog.json').then((r) => r.json()).then((j) => this.setState({ list: j[this.cid()] || [] })).catch(() => {});
  }
  renderVals() {
    const id = this.cid();
    const name = id.split('-').map((w) => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
    const book = 'AtlasKatalog.dc.html?c=' + id;
    const list = this.state.list;
    const cards = list.length ? list.map((r) => ({ title: r.t, img: 'assets/catalog/' + id + '/' + r.h + '.jpg', href: book + '#' + (id === 'atlas' ? r.h.split('-')[1] : r.h) })) : [{ title: name, img: 'assets/collections/' + id + '.webp', href: book }];
    return { name, bookHref: book, cards, countLabel: cards.length + ' halı' };
  }
}
</script>
</body>
</html>
