name: Patch auth entry controls
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-auth-entry.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply auth entry patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # CUSTOMER ACCOUNT
          p=Path('Hesabim.dc.html')
          s=p.read_text(encoding='utf-8')

          # Replace mount with OAuth callback-aware mount.
          pat=re.compile(r" componentDidMount\(\)\{.*?\n _authSession\(\)",re.S)
          repl=""" componentDidMount(){
  const hash=new URLSearchParams((window.location.hash||'').replace(/^#/,'') );
  const oauthToken=hash.get('access_token');
  if(oauthToken){
    const refresh=hash.get('refresh_token')||'';
    fetch(SUPABASE_URL+'/auth/v1/user',{headers:{apikey:SUPABASE_ANON_KEY,Authorization:'Bearer '+oauthToken}}).then((r)=>r.json().then((j)=>({ok:r.ok,data:j}))).then((res)=>{
      if(!res.ok||!res.data||!res.data.id)throw new Error('oauth user failed');
      const sess={access_token:oauthToken,refresh_token:refresh,user:res.data};
      try{localStorage.setItem('ah_auth',JSON.stringify(sess));history.replaceState({},document.title,window.location.pathname+window.location.search);}catch(e){}
      this.setState({authUser:res.data,authFlowState:'idle',authError:''});this.loadMySampleRequests();
    }).catch(()=>this.setState({authUser:null,authError:this.state.lang==='tr'?'Sosyal giriş tamamlanamadı.':'Social sign-in could not be completed.'}));
  }else{
    try{const tab=(window.location.hash||'').replace('#','');if(['samples','requests','company'].includes(tab))this.setState({accountTab:tab});}catch(e){}
    try{const sess=JSON.parse(localStorage.getItem('ah_auth')||'null');if(sess&&sess.user){if(!sess.user.email_confirmed_at){this.setState({authFlowState:'login_unverified',pendingEmail:sess.user.email});}else{this.setState({authUser:sess.user});this.loadMySampleRequests();}}}catch(e){}
  }
  try{const saved=JSON.parse(localStorage.getItem('ah_samples')||'[]');if(Array.isArray(saved))this.setState({samples:saved.filter((x)=>x&&x.id!=null)});}catch(e){}
 }
 oauthLogin(provider){const redirect=window.location.origin+window.location.pathname;window.location.href=SUPABASE_URL+'/auth/v1/authorize?provider='+encodeURIComponent(provider)+'&redirect_to='+encodeURIComponent(redirect);}
 _authSession()"""
          s,n=pat.subn(repl,s,count=1)
          if n!=1: raise SystemExit(f'customer componentDidMount replacement count={n}')

          marker="submitAuthFn:()=>this.submitAuthForm(),logoutFn:()=>this.logout(),"
          if marker not in s: raise SystemExit('customer render marker missing')
          s=s.replace(marker,"submitAuthFn:()=>this.submitAuthForm(),googleLoginFn:()=>this.oauthLogin('google'),appleLoginFn:()=>this.oauthLogin('apple'),logoutFn:()=>this.logout(),",1)

          btn='<button type="button" onClick="{{ submitAuthFn }}" disabled="{{ authBusy }}" class="primary-btn">{{ authSubmitLabel }}</button>'
          if btn not in s: raise SystemExit('customer auth button missing')
          extra=btn+'''<a href="HesapReset.html" style="display:block;text-align:right;margin-top:10px;color:#7b4527;font:600 12px/1.3 'DM Sans',sans-serif;text-decoration:none">Şifremi unuttum</a><div style="display:flex;align-items:center;gap:10px;margin:18px 0 12px;color:rgba(34,28,24,.42);font:600 11px/1 'DM Sans',sans-serif;text-transform:uppercase;letter-spacing:.08em"><span style="height:1px;background:rgba(76,38,15,.14);flex:1"></span><span>veya</span><span style="height:1px;background:rgba(76,38,15,.14);flex:1"></span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button type="button" onClick="{{ googleLoginFn }}" class="secondary-btn">Google ile giriş</button><button type="button" onClick="{{ appleLoginFn }}" class="secondary-btn">Apple ile giriş</button></div>'''
          s=s.replace(btn,extra,1)
          p.write_text(s,encoding='utf-8')

          # ADMIN
          p=Path('Admin.dc.html')
          s=p.read_text(encoding='utf-8')
          old="componentDidMount() { try { const sess = JSON.parse(localStorage.getItem('ah_admin_auth') || 'null'); if (sess && sess.user) { this.setState({ authUser: sess.user }); this.checkAdmin(sess); } else this.setState({ adminChecked: true }); } catch (e) { this.setState({ adminChecked: true }); } }"
          if old not in s: raise SystemExit('admin componentDidMount marker missing')
          new="""componentDidMount() { const hash=new URLSearchParams((window.location.hash||'').replace(/^#/,'') ); const oauthToken=hash.get('access_token'); if(oauthToken){ const sess={access_token:oauthToken,refresh_token:hash.get('refresh_token')||'',user:null}; fetch(SUPABASE_URL+'/auth/v1/user',{headers:{apikey:SUPABASE_ANON_KEY,Authorization:'Bearer '+oauthToken}}).then((r)=>r.json().then((j)=>({ok:r.ok,data:j}))).then((res)=>{ if(!res.ok||!res.data||!res.data.id)throw new Error('oauth user failed'); sess.user=res.data; localStorage.setItem('ah_admin_auth',JSON.stringify(sess)); history.replaceState({},document.title,window.location.pathname+window.location.search); this.setState({authUser:res.data}); this.checkAdmin(sess); }).catch(()=>this.setState({adminChecked:true,authError:'Sosyal giriş tamamlanamadı.'})); return; } try { const sess = JSON.parse(localStorage.getItem('ah_admin_auth') || 'null'); if (sess && sess.user) { this.setState({ authUser: sess.user }); this.checkAdmin(sess); } else this.setState({ adminChecked: true }); } catch (e) { this.setState({ adminChecked: true }); } }
oauthLogin(provider) { const redirect=window.location.origin+window.location.pathname; window.location.href=SUPABASE_URL+'/auth/v1/authorize?provider='+encodeURIComponent(provider)+'&redirect_to='+encodeURIComponent(redirect); }"""
          s=s.replace(old,new,1)
          marker="submitLoginFn:()=>this.submitLogin(), logoutFn:()=>this.logout(),"
          if marker not in s: raise SystemExit('admin render marker missing')
          s=s.replace(marker,"submitLoginFn:()=>this.submitLogin(), googleLoginFn:()=>this.oauthLogin('google'), appleLoginFn:()=>this.oauthLogin('apple'), logoutFn:()=>this.logout(),",1)
          btn='<button type="button" onClick="{{ submitLoginFn }}" disabled="{{ authBusy }}" class="primary-btn">{{ loginBtnLabel }}</button>'
          if btn not in s: raise SystemExit('admin login button missing')
          extra=btn+'''<a href="AdminReset.html" style="display:block;text-align:right;margin-top:10px;color:#7b4527;font:600 12px/1.3 'DM Sans',sans-serif;text-decoration:none">Şifremi unuttum</a><div style="display:flex;align-items:center;gap:10px;margin:18px 0 12px;color:rgba(34,28,24,.42);font:600 11px/1 'DM Sans',sans-serif;text-transform:uppercase;letter-spacing:.08em"><span style="height:1px;background:rgba(76,38,15,.14);flex:1"></span><span>veya</span><span style="height:1px;background:rgba(76,38,15,.14);flex:1"></span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button type="button" onClick="{{ googleLoginFn }}" class="logout-btn" style="width:100%;color:#4c260f;border-color:rgba(76,38,15,.22)">Google ile giriş</button><button type="button" onClick="{{ appleLoginFn }}" class="logout-btn" style="width:100%;color:#4c260f;border-color:rgba(76,38,15,.22)">Apple ile giriş</button></div>'''
          s=s.replace(btn,extra,1)
          p.write_text(s,encoding='utf-8')
          print('AUTH_ENTRY_PATCH_APPLIED')
          PY
      - name: Check embedded scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for f in ['Admin.dc.html','Hesabim.dc.html']:
            s=Path(f).read_text(encoding='utf-8')
            m=re.search(r'<script type="text/x-dc" data-dc-script>(.*?)</script>',s,re.S)
            if not m: raise SystemExit(f+' embedded script missing')
            Path('/tmp/'+f+'.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/Admin.dc.html.js
          node --check /tmp/Hesabim.dc.html.js
      - name: Commit product patch
        run: |
          rm .github/workflows/patch-auth-entry.yml
          git config user.name "SSSaruman"
          git config user.email "ufuk.karahann@gmail.com"
          git add Admin.dc.html Hesabim.dc.html .github/workflows/patch-auth-entry.yml
          git diff --cached --check
          git commit -m "feat: add OAuth and password recovery entry points"
          git push
