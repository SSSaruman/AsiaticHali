name: Fix customer flow regressions
on:
  push:
    paths:
      - '.github/workflows/fix-customer-flow-regressions.yml'
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted fixes
        run: python3 .github/scripts/fix_customer_flow.py
      - name: Check embedded script syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, os
          for fn in ['index.html','Hesabim.dc.html','Admin.dc.html']:
              src=Path(fn).read_text(encoding='utf-8')
              m=re.search(r'<script[^>]*data-dc-script[^>]*>([\s\S]*?)</script>',src)
              if not m: raise SystemExit('missing data-dc-script: '+fn)
              f=tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8')
              f.write(m.group(1)); f.close()
              r=subprocess.run(['node','--check',f.name],capture_output=True,text=True)
              os.unlink(f.name)
              if r.returncode: raise SystemExit(fn+' JS syntax failed\n'+r.stderr)
          print('DC_SCRIPT_SYNTAX_PASS')
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/fix-customer-flow-regressions.yml .github/workflows/audit-customer-flow.yml .github/scripts/fix_customer_flow.py
          git add index.html Hesabim.dc.html Admin.dc.html
          git diff --cached --check
          git commit -m "fix: complete customer request and account flows [skip ci]"
          git push
# rerun after repairing corrupted pending-action call