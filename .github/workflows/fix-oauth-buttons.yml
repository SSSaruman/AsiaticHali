name: Fix OAuth buttons
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-oauth-buttons.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add provider icons
        run: |
          python3 - <<'PY'
          from pathlib import Path

          google_svg='''<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.6 12.23c0-.71-.06-1.39-.18-2.05H12v3.87h5.38a4.6 4.6 0 0 1-2 3.02v2.51h3.23c1.89-1.74 2.99-4.3 2.99-7.35Z"/><path fill="#34A853" d="M12 22c2.7 0 4.96-.9 6.61-2.42l-3.23-2.51c-.9.6-2.05.96-3.38.96-2.6 0-4.81-1.76-5.6-4.12H3.06v2.59A9.99 9.99 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.4 13.91A6 6 0 0 1 6.09 12c0-.66.11-1.3.31-1.91V7.5H3.06A10 10 0 0 0 2 12c0 1.61.38 3.14 1.06 4.5l3.34-2.59Z"/><path fill="#EA4335" d="M12 5.97c1.47 0 2.79.5 3.83 1.5l2.87-2.87A9.63 9.63 0 0 0 12 2a9.99 9.99 0 0 0-8.94 5.5l3.34 2.59c.79-2.36 3-4.12 5.6-4.12Z"/></svg>'''
          apple_svg='''<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.79 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.53 4.1ZM12.03 7.25C11.88 5.02 13.69 3.18 15.77 3c.29 2.58-2.34 4.5-3.74 4.25Z"/></svg>'''
          targets=['Admin.dc.html','Hesabim.dc.html']
          for fn in targets:
            p=Path(fn); s=p.read_text(encoding='utf-8')
            s=s.replace('>Google ile giriş</button>', ' style="display:flex;align-items:center;justify-content:center;gap:9px">'+google_svg+'<span>Google ile giriş</span></button>') if fn=='Hesabim.dc.html' else s
            s=s.replace('>Apple ile giriş</button>', ' style="display:flex;align-items:center;justify-content:center;gap:9px">'+apple_svg+'<span>Apple ile giriş</span></button>') if fn=='Hesabim.dc.html' else s
            if fn=='Admin.dc.html':
              s=s.replace('>Google ile giriş</button>', '>'+google_svg+'<span>Google ile giriş</span></button>')
              s=s.replace('>Apple ile giriş</button>', '>'+apple_svg+'<span>Apple ile giriş</span></button>')
              s=s.replace('style="width:100%;color:#4c260f;border-color:rgba(76,38,15,.22)">'+google_svg, 'style="width:100%;color:#4c260f;border-color:rgba(76,38,15,.22);display:flex;align-items:center;justify-content:center;gap:9px">'+google_svg)
              s=s.replace('style="width:100%;color:#4c260f;border-color:rgba(76,38,15,.22)">'+apple_svg, 'style="width:100%;color:#4c260f;border-color:rgba(76,38,15,.22);display:flex;align-items:center;justify-content:center;gap:9px">'+apple_svg)
            p.write_text(s,encoding='utf-8')
          PY
      - name: Check provider endpoints
        run: |
          set +e
          for provider in google apple; do
            url="https://dytyehxybhzlmwxarbpc.supabase.co/auth/v1/authorize?provider=$provider&redirect_to=https%3A%2F%2Fsssaruman.github.io%2FAsiaticHali%2FHesabim.dc.html"
            code=$(curl -sS -o "/tmp/$provider.body" -D "/tmp/$provider.headers" -w '%{http_code}' "$url")
            echo "=== $provider HTTP $code ==="
            grep -i '^location:' "/tmp/$provider.headers" || true
            cat "/tmp/$provider.body" | head -c 500 || true
            echo
          done
      - name: Verify touched markup
        run: |
          grep -q 'Google ile giriş' Admin.dc.html
          grep -q 'Apple ile giriş' Admin.dc.html
          grep -q 'Google ile giriş' Hesabim.dc.html
          grep -q 'Apple ile giriş' Hesabim.dc.html
          grep -q '<svg width="18" height="18"' Admin.dc.html
          grep -q '<svg width="18" height="18"' Hesabim.dc.html
      - name: Commit icon fix
        run: |
          rm .github/workflows/fix-oauth-buttons.yml
          git config user.name "SSSaruman"
          git config user.email "ufuk.karahann@gmail.com"
          git add Admin.dc.html Hesabim.dc.html .github/workflows/fix-oauth-buttons.yml
          git diff --cached --check
          git commit -m "fix: add Google and Apple login icons"
          git push
