name: Gate range builder behind account
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gate-range-builder.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch auth gate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old_go="""  go(id) {\n    return (e) => {\n      e.preventDefault();\n      const el = document.getElementById(id);\n      if (el && this.scroller) this.scroller.scrollTo({ top: el.offsetTop, behavior: 'smooth' });\n      this.setState({ menu: false });\n    };\n  }\n"""
          new_go="""  go(id) {\n    return (e) => {\n      e.preventDefault();\n      if (id === 's08' && !this.state.authUser) {\n        this.setState({ menu: false });\n        this.openAuthModal('login', { type: 'rangeBuilder' });\n        return;\n      }\n      const el = document.getElementById(id);\n      if (el && this.scroller) this.scroller.scrollTo({ top: el.offsetTop, behavior: 'smooth' });\n      this.setState({ menu: false });\n    };\n  }\n"""
          if old_go not in s: raise SystemExit('go block not found')
          s=s.replace(old_go,new_go,1)

          old_pending="""      const pending = this.state.authPendingAction;\n      if (pending && pending.type === 'sampleRequest') this.doSubmitSampleRequest(pending.items, sess);\n      this.setState({ authPendingAction: null });\n"""
          new_pending="""      const pending = this.state.authPendingAction;\n      if (pending && pending.type === 'sampleRequest') this.doSubmitSampleRequest(pending.items, sess);\n      if (pending && pending.type === 'rangeBuilder') {\n        setTimeout(() => {\n          const el = document.getElementById('s08');\n          if (el && this.scroller) this.scroller.scrollTo({ top: el.offsetTop, behavior: 'smooth' });\n        }, 0);\n      }\n      this.setState({ authPendingAction: null });\n"""
          if old_pending not in s: raise SystemExit('pending block not found')
          s=s.replace(old_pending,new_pending,1)

          start="""<!-- 08 — RANGE BUILDER -->\n<section id=\"s08\" data-screen-label=\"08 Range Builder\" style=\"{{ rbSectionStyle }}\">\n"""
          repl_start="""<!-- 08 — RANGE BUILDER -->\n<sc-if value=\"{{ isAuthed }}\" hint-placeholder-val=\"{{ false }}\">\n<section id=\"s08\" data-screen-label=\"08 Range Builder\" style=\"{{ rbSectionStyle }}\">\n"""
          if start not in s: raise SystemExit('range start not found')
          s=s.replace(start,repl_start,1)

          end="""</section>\n\n<!-- 09 — TRADE TOOLKIT -->\n"""
          repl_end="""</section>\n</sc-if>\n\n<!-- 09 — TRADE TOOLKIT -->\n"""
          if end not in s: raise SystemExit('range end not found')
          s=s.replace(end,repl_end,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "SSSaruman"
          git config user.email "ufuk.karahann@gmail.com"
          git add index.html
          git commit -m "fix: gate range builder behind customer login" || exit 0
          git push
