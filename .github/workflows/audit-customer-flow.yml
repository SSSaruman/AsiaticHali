name: Audit customer flow
on:
  push:
    paths:
      - '.github/workflows/audit-customer-flow.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect targeted flows
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files=['index.html','Hesabim.dc.html','Admin.dc.html']
          needles={
            'index.html':['doSubmitSampleRequest','sampleReqSent','mailto:','Hesabim.dc.html','Numuneler','contact_requests','submitContact','sample_list_items'],
            'Hesabim.dc.html':['saveProfile','requestAllSamples','loadMySampleRequests','sampleReqSent','profiles?','sample_request_items'],
            'Admin.dc.html':['loadCompanies','loadCompanyRequests','contact_requests','sample_requests','profiles?']
          }
          def function_body(src,name):
            starts=[src.find(f'function {name}('),src.find(f'  {name}('),src.find(f' {name}('),src.find(f'{name}(')]
            starts=[x for x in starts if x>=0]
            if not starts:return None
            s=min(starts); b=src.find('{',s)
            if b<0:return None
            depth=0; q=None; esc=False
            for i in range(b,len(src)):
              c=src[i]
              if q:
                if esc: esc=False
                elif c=='\\': esc=True
                elif c==q:q=None
              else:
                if c in "'\"`":q=c
                elif c=='{':depth+=1
                elif c=='}':
                  depth-=1
                  if depth==0:return src[s:i+1]
            return None
          for fn in files:
            src=Path(fn).read_text(encoding='utf-8')
            print('\n===== '+fn+' =====')
            print('size',len(src))
            for n in needles[fn]:
              if n in ['doSubmitSampleRequest','saveProfile','requestAllSamples','loadMySampleRequests','loadCompanies','loadCompanyRequests','submitContact']:
                body=function_body(src,n)
                print('\n--- FUNCTION',n,'---\n',body[:7000] if body else 'NOT FOUND')
              else:
                print('\n--- MATCHES',n,'---')
                pos=0; count=0
                while True:
                  pos=src.find(n,pos)
                  if pos<0 or count>=8:break
                  print(src[max(0,pos-450):min(len(src),pos+900)].replace('\n',' '))
                  pos+=len(n); count+=1
                print('count_shown',count)
          PY