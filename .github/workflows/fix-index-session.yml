name: Fix index session fallback
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-index-session.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch exact index session block
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""  _freshSession() {\n    const sess = this._authSession();\n    if (!sess || !sess.refresh_token) return Promise.reject(new Error('missing refresh token'));\n    return sbAuthFetch('/token?grant_type=refresh_token', { refresh_token: sess.refresh_token }).then((res) => {\n      if (!res.ok || !res.data || !res.data.access_token || !res.data.user) throw new Error('session refresh failed');\n      const next = { access_token: res.data.access_token, refresh_token: res.data.refresh_token || sess.refresh_token, user: res.data.user };\n      this._persistAuth(next);\n      return next;\n    });\n  }\n"""
          new="""  _freshSession() {\n    const sess = this._authSession();\n    if (!sess || !sess.access_token) return Promise.reject(new Error('missing session'));\n    const validate = () => fetch(SUPABASE_URL + '/auth/v1/user', { headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + sess.access_token } })\n      .then((r) => r.json().then((j) => ({ ok: r.ok, data: j })))\n      .then((res) => {\n        if (!res.ok || !res.data || !res.data.id) throw new Error('session invalid');\n        const next = { access_token: sess.access_token, refresh_token: sess.refresh_token || '', user: res.data };\n        this._persistAuth(next);\n        return next;\n      });\n    if (!sess.refresh_token) return validate();\n    return sbAuthFetch('/token?grant_type=refresh_token', { refresh_token: sess.refresh_token }).then((res) => {\n      if (res.ok && res.data && res.data.access_token && res.data.user) {\n        const next = { access_token: res.data.access_token, refresh_token: res.data.refresh_token || sess.refresh_token, user: res.data.user };\n        this._persistAuth(next);\n        return next;\n      }\n      return validate();\n    });\n  }\n"""
          if old not in s:
              raise SystemExit('exact target block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "SSSaruman"
          git config user.email "ufuk.karahann@gmail.com"
          git add index.html
          git commit -m "fix: keep valid site sessions usable" || exit 0
          git push
