name: P0 real auth fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/p0-real-auth-fix.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply minimum auth refresh fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def once(text, pattern, repl, label):
              out, n = re.subn(pattern, repl, text, count=1, flags=re.S)
              if n != 1: raise SystemExit(f'{label}: {n}')
              return out

          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          marker="  _authSession() {\n    try { return JSON.parse(localStorage.getItem('ah_auth') || 'null'); } catch (e) { return null; }\n  }"
          if marker not in s: raise SystemExit('index auth marker missing')
          s=s.replace(marker,marker+"\n  _freshSession() {\n    const sess = this._authSession();\n    if (!sess || !sess.refresh_token) return Promise.reject(new Error('missing refresh token'));\n    return sbAuthFetch('/token?grant_type=refresh_token', { refresh_token: sess.refresh_token }).then((res) => {\n      if (!res.ok || !res.data || !res.data.access_token || !res.data.user) throw new Error('session refresh failed');\n      const next = { access_token: res.data.access_token, refresh_token: res.data.refresh_token || sess.refresh_token, user: res.data.user };\n      this._persistAuth(next);\n      return next;\n    });\n  }",1)
          s=once(s,r"  requestSampleSubmission\(items\) \{.*?\n  doSubmitSampleRequest\(items, sess\) \{","  requestSampleSubmission(items) {\n    if (!this.state.authUser) { this.openAuthModal('login', { type: 'sampleRequest', items }); return; }\n    this.setState({ sampleReqBusy: true, sampleReqSent: false, sampleReqError: '' });\n    this._freshSession().then((sess) => this.doSubmitSampleRequest(items, sess)).catch(() => {\n      try { localStorage.removeItem('ah_auth'); } catch (e) {}\n      this.setState({ authUser: null, authOpen: true, authMode: 'login', sampleReqBusy: false, sampleReqSent: false, sampleReqError: 'Oturumunuz yenilenemedi. Lütfen tekrar giriş yapın.' });\n    });\n  }\n  doSubmitSampleRequest(items, sess) {",'index request')
          p.write_text(s,encoding='utf-8')

          p=Path('Hesabim.dc.html'); s=p.read_text(encoding='utf-8')
          marker=" _authSession(){try{return JSON.parse(localStorage.getItem('ah_auth')||'null');}catch(e){return null;}}"
          if marker not in s: raise SystemExit('account auth marker missing')
          s=s.replace(marker,marker+"\n _persistFreshSession(sess){try{localStorage.setItem('ah_auth',JSON.stringify(sess));}catch(e){}this.setState({authUser:sess.user});return sess;}\n _freshSession(){const sess=this._authSession();if(!sess||!sess.refresh_token)return Promise.reject(new Error('missing refresh token'));return sbAuthFetch('/token?grant_type=refresh_token',{refresh_token:sess.refresh_token}).then((res)=>{if(!res.ok||!res.data||!res.data.access_token||!res.data.user)throw new Error('session refresh failed');return this._persistFreshSession({access_token:res.data.access_token,refresh_token:res.data.refresh_token||sess.refresh_token,user:res.data.user});});}",1)
          s=once(s,r" saveProfile\(\)\{.*?\n updatePasswordField"," saveProfile(){const f=this.state.profileForm;this.setState({profileSaving:true,profileError:'',profileSaved:false});this._freshSession().then((sess)=>sbRest('/profiles?id=eq.'+sess.user.id,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({full_name:f.fullName||null,company:f.companyName||null,phone:f.phone||null,address:f.address||null})},sess.access_token)).then((res)=>{const row=res.ok&&res.data&&res.data[0];if(!row)throw new Error('profile save failed');this.setState({profileSaving:false,profileSaved:true,profileError:''});}).catch(()=>this.setState({profileSaving:false,profileSaved:false,profileError:this.state.lang==='tr'?'Kaydedilemedi. Lütfen tekrar giriş yapıp deneyin.':'Could not save. Please sign in again and retry.'}));}\n updatePasswordField",'profile save')
          s=once(s,r"\nrequestAllSamples\(\)\{.*?\n renderVals\(\)","\nrequestAllSamples(){const items=(this.state.samples||[]).map((p)=>({product_id:String(p.id!=null?p.id:''),product_name:p.name}));if(!items.length){this.setState({sampleReqBusy:false,sampleReqSent:false,sampleReqError:this.state.lang==='tr'?'Numune talebi oluşturulamadı.':'Sample request could not be created.'});return;}this.setState({sampleReqBusy:true,sampleReqSent:false,sampleReqError:''});this._freshSession().then((sess)=>this.mergeGuestSamplesToAccount(sess).catch(()=>null).then(()=>sbRest('/sample_requests',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({user_id:sess.user.id})},sess.access_token)).then((res)=>{const req=res.ok&&res.data&&res.data[0];if(!req)throw new Error('sample request insert failed');return sbRest('/sample_request_items',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(items.map((it)=>Object.assign({request_id:req.id},it)))},sess.access_token);})).then((itemRes)=>{if(!itemRes||!itemRes.ok)throw new Error('sample request items insert failed');this.setState({sampleReqBusy:false,sampleReqSent:true,samples:[],requestsLoaded:false});try{localStorage.removeItem('ah_samples');}catch(e){}this.loadMySampleRequests();}).catch(()=>this.setState({sampleReqBusy:false,sampleReqSent:false,sampleReqError:this.state.lang==='tr'?'Gönderilemedi. Lütfen tekrar giriş yapıp deneyin.':'Could not send. Please sign in again and retry.'}));}\n renderVals()",'account request')
          p.write_text(s,encoding='utf-8')

          assert '_freshSession()' in Path('index.html').read_text(encoding='utf-8')
          assert '_freshSession()' in Path('Hesabim.dc.html').read_text(encoding='utf-8')
          print('P0_WRITE_AUTH_PATCH_PASS')
          PY
      - name: Commit product fix and remove temporary workflow
        run: |
          rm .github/workflows/p0-real-auth-fix.yml
          git config user.name "SSSaruman"
          git config user.email "ufuk.karahann@gmail.com"
          git add index.html Hesabim.dc.html .github/workflows/p0-real-auth-fix.yml
          git diff --cached --check
          git commit -m "fix: refresh customer auth before protected writes"
          git push
