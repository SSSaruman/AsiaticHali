<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400&family=DM+Sans:opsz,wght@9..40,300..700&display=swap">
<style>
html,body{margin:0;padding:0;background:#f2e7dd;color:#221c18;font-family:"DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box;scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
a{color:#4c260f;text-decoration:none}
a:hover{color:#a55a34}
</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-direction:column">
  <header style="position:sticky;top:0;z-index:10;background:rgba(242,231,221,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(76,38,15,.1)">
    <div style="max-width:900px;margin:0 auto;padding:18px clamp(20px,4vw,32px);display:flex;align-items:center;justify-content:space-between">
      <a href="Asiatic Hali.dc.html" style="display:inline-flex;align-items:center;min-height:44px;font:400 22px/1 'Playfair Display',serif;color:#102a3a">Asiatic Halı</a>
      <a href="Asiatic Hali.dc.html" style="display:inline-flex;align-items:center;min-height:44px;font:500 12px/1 'DM Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase">← Ana sayfa</a>
    </div>
  </header>
  <main style="flex:1;width:100%;max-width:640px;margin:0 auto;padding:clamp(40px,7vh,72px) clamp(20px,4vw,32px) clamp(64px,10vh,110px)">
    <p style="margin:0;font:500 11px/1 'DM Sans',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#a55a34">Ticari hesap</p>
    <h1 style="margin:14px 0 0;font:400 clamp(30px,4vw,46px)/1.1 'Playfair Display',serif;color:#102a3a">Ticari hesap başvurusu</h1>
    <p style="margin:16px 0 28px;font:300 15.5px/1.65 'DM Sans',sans-serif;color:rgba(34,28,24,.76);text-wrap:pretty">Ticari hesap ve fiyat listesi için bilgilerinizi bırakın. Gaziantep'ten bir iş günü içinde dönüyoruz.</p>
    <sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">
      <div role="status" style="padding:24px;border-radius:20px;background:#fbf5ee;border:1px solid rgba(76,38,15,.1)">
        <p style="margin:0;font:400 22px/1.2 'Playfair Display',serif;color:#102a3a">Başvurunuz alındı.</p>
        <p style="margin:10px 0 0;font:500 12px/1.4 'DM Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#a55a34">Referans no: {{ ref }}</p>
        <a href="Kataloglar.dc.html" style="display:inline-block;margin-top:18px;font:500 12px/1 'DM Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase">Kataloglara dön →</a>
      </div>
    </sc-if>
    <sc-if value="{{ notSent }}" hint-placeholder-val="{{ true }}">
      <form onSubmit="{{ submit }}" noValidate style="display:grid;gap:16px">
        <label style="display:flex;flex-direction:column;gap:7px;font:500 10.5px/1 'DM Sans',sans-serif;letter-spacing:.16em;text-transform:uppercase">Ad Soyad
          <input type="text" name="name" style="{{ inputStyle }}">
        </label>
        <label style="display:flex;flex-direction:column;gap:7px;font:500 10.5px/1 'DM Sans',sans-serif;letter-spacing:.16em;text-transform:uppercase">Firma
          <input type="text" name="company" style="{{ inputStyle }}">
        </label>
        <label style="display:flex;flex-direction:column;gap:7px;font:500 10.5px/1 'DM Sans',sans-serif;letter-spacing:.16em;text-transform:uppercase">E-posta
          <input type="email" name="email" style="{{ inputStyle }}">
        </label>
        <label style="display:flex;flex-direction:column;gap:7px;font:500 10.5px/1 'DM Sans',sans-serif;letter-spacing:.16em;text-transform:uppercase">Telefon
          <input type="tel" name="phone" style="{{ inputStyle }}">
        </label>
        <label style="display:flex;flex-direction:column;gap:7px;font:500 10.5px/1 'DM Sans',sans-serif;letter-spacing:.16em;text-transform:uppercase">Ülke
          <input type="text" name="country" style="{{ inputStyle }}">
        </label>
        <label style="display:flex;flex-direction:column;gap:7px;font:500 10.5px/1 'DM Sans',sans-serif;letter-spacing:.16em;text-transform:uppercase">Ne satıyorsunuz?
          <textarea name="message" rows="3" style="{{ inputStyle }}"></textarea>
        </label>
        <label style="display:flex;align-items:flex-start;gap:10px;font:300 13px/1.5 'DM Sans',sans-serif">
          <input type="checkbox" name="consent" style="margin-top:3px"> Asiatic Halı'nın bu başvuru hakkında benimle iletişime geçmesini kabul ediyorum.
        </label>
        <sc-if value="{{ hasError }}" hint-placeholder-val="{{ false }}"><p role="alert" style="margin:0;font:400 13px/1.4 'DM Sans',sans-serif;color:#a5342f">{{ error }}</p></sc-if>
        <button type="submit" disabled="{{ busy }}" style="min-height:52px;border:none;border-radius:14px;background:#4c260f;color:#f6ece2;font:500 12px/1 'DM Sans',sans-serif;letter-spacing:.13em;text-transform:uppercase;cursor:pointer">{{ btnLabel }}</button>
      </form>
    </sc-if>
  </main>
  <footer style="background:#221812;padding:28px clamp(20px,4vw,32px);text-align:center">
    <p style="margin:0;font:300 12.5px/1.5 'DM Sans',sans-serif;color:rgba(246,236,226,.56)">© 2026 Asiatic Halı Türkiye. Tüm hakları saklıdır.</p>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const SB = 'https://dytyehxybhzlmwxarbpc.supabase.co';
const KEY = 'sb_publishable_oMWdZv_LTS3-3KbnzElAeg_tXBpy-cO';
class Component extends DCLogic {
  state = { busy: false, sent: false, error: '', ref: '' };
  submit = (e) => {
    e.preventDefault();
    const f = e.target;
    const g = (n) => (f.elements[n] ? f.elements[n].value.trim() : '');
    const v = { name: g('name'), company: g('company'), email: g('email'), phone: g('phone'), country: g('country'), message: g('message'), consent: !!(f.elements.consent && f.elements.consent.checked) };
    if (!v.name) return this.setState({ error: 'Lütfen adınızı girin.' });
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email)) return this.setState({ error: 'Lütfen geçerli bir e-posta adresi girin.' });
    if (!v.consent) return this.setState({ error: 'Lütfen iletişime geçilmesini onaylayın.' });
    this.setState({ busy: true, error: '' });
    fetch(SB + '/rest/v1/contact_requests', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: KEY, Authorization: 'Bearer ' + KEY, Prefer: 'return=minimal' },
      body: JSON.stringify({ name: v.name, company: v.company || null, email: v.email, phone: v.phone || null, country: v.country || null, customer_type: 'Ticari hesap başvurusu', message: v.message || null, consent: true })
    }).then((r) => {
      if (!r.ok) throw new Error(String(r.status));
      this.setState({ busy: false, sent: true, ref: 'AH-' + Date.now().toString(36).toUpperCase() });
    }).catch(() => this.setState({ busy: false, error: 'Gönderilemedi. Lütfen export@asiatichali.com adresine yazın.' }));
  };
  renderVals() {
    const s = this.state;
    return {
      sent: s.sent, notSent: !s.sent, busy: s.busy, ref: s.ref, error: s.error, hasError: !!s.error, submit: this.submit,
      btnLabel: s.busy ? 'Gönderiliyor…' : 'Başvuruyu gönder',
      inputStyle: { font: '400 15px/1.3 "DM Sans",sans-serif', letterSpacing: 0, textTransform: 'none', padding: '13px 14px', borderRadius: '12px', border: '1px solid rgba(76,38,15,.24)', background: '#fbf5ee', color: '#221c18', width: '100%', resize: 'vertical' }
    };
  }
}
</script>
</body>
</html>
